name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 install zrail --version 0.0.2 --locked
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: cargo +1.96.1 install zcheck --version 0.0.1 --locked
      - run: cargo fetch --locked
      - run: zcheck run check --format github

  portable:
    name: portable (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo test --workspace --all-targets --all-features --locked

  latest-stable:
    name: latest stable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: scripts/coverage

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --all-features check advisories licenses sources bans

[workspace]
members = [
  "crates/calandria",
  "crates/calandria-sim",
  "crates/calandria-mio",
]
resolver = "3"

[workspace.package]
version = "0.0.1-rc.1"
edition = "2024"
rust-version = "1.88"
authors = ["zsumz <shawn@zsumz.com>"]
license = "Apache-2.0"
repository = "https://github.com/zsumz/calandria"
homepage = "https://github.com/zsumz/calandria"

[workspace.dependencies]
calandria = { version = "=0.0.1-rc.1", path = "crates/calandria", default-features = false }
mio = { version = "1.2.2", default-features = false, features = ["os-poll"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(calandria_loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

schema = 1
adapters = ["rust"]

[repository]
roots = ["crates"]
exclude = []
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[dependencies]
mode = "locked"
unassigned_packages = "deny"
cycles = "deny"

[source.rust]
module_docs = "required"
facades = "declarative"
entrypoints = "declarative"
tests = "sibling"

[source.rust.macros]
mode = "allow"

[source.rust.hygiene]
unsafe = "deny"
lint_suppressions = "deny"
deny_methods = ["unwrap", "expect"]
deny_macros = ["todo", "unimplemented", "unreachable", "dbg"]

[source.rust.size.facade]
target = 80
hard = 120

[source.rust.size.implementation]
target = 240
hard = 300

[source.rust.size.test]
target = 300
hard = 300

[source.rust.size.auxiliary]
target = 300
hard = 300

[[layer]]
name = "core"
packages = ["calandria"]
may_depend_on = []
reason = "Runtime-neutral ownership and lifecycle contracts remain independent of adapters."

[layer.dependencies]
external = "locked"

[[layer]]
name = "adapters"
packages = ["calandria-mio", "calandria-sim"]
may_depend_on = ["core"]
reason = "Production readiness and deterministic simulation depend only on the core contracts."

[layer.dependencies]
external = "locked"

[package]
name = "calandria"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/calandria"
description = "Bounded reactor framework for explicit single-owner systems"
keywords = ["reactor", "event-loop", "runtime-neutral", "concurrency"]
categories = ["concurrency", "network-programming", "no-std"]
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lints]
workspace = true

[dev-dependencies]
loom = "0.7.2"

[package]
name = "calandria-mio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/calandria-mio"
description = "Mio readiness adapter for Calandria reactors"
keywords = ["reactor", "mio", "event-loop", "networking"]
